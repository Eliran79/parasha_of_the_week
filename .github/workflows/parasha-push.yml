name: Weekly Parasha Push Notification

on:
  schedule:
    # Every Friday at 14:00 UTC = 16:00 Israel time (UTC+2), before Shabbat
    - cron: '0 14 * * 5'
  workflow_dispatch:  # allow manual trigger for testing

jobs:
  send-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install PyYAML python-frontmatter requests

      - name: Find this week's parasha and send push
        env:
          FIREBASE_SERVER_KEY: ${{ secrets.FIREBASE_SERVER_KEY }}
          FCM_TOPIC: parasha_weekly
        run: python3 scripts/send_push.py
